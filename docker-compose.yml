version: "5.1.2"

services:
    mariadb:
        build: srcs/requirements/mariadb/Dockerfile
        restart: always
    
        env_file:
            - .env
        volumes:
           - storage:/val/lib/mysql
        networks:
            - inception
    
    wordpress:
        build: srcs/requirements/wordpress/Dockerfile
    
        restart: always
        env_file:
            - .env
        
        depends_on:
            - mariadb
        volumes:
            - storage:/srv/www/wordpress
        networks:
            - inception
    nginx:
        build: srcs/requirements/nginx/Dockerfile
        
        restart: always
        
        port:
            - 443:443
        networkds:
            inception
        
        depends_on:
            wordpress
networks:
    inception:
        driver:
            bridge
        
volumes:
    storage:
        /var/www/wordpress    

