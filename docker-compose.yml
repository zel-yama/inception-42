version: "3.8"
services:
    mariadb:
        build: srcs/requirements/mariadb/
        restart: always
    
        container_name: mariadb
        env_file:
            - .env
        volumes:
            - storage:/var/lib/mysql
        networks:
            - inception
    
    wordpress:
        build: srcs/requirements/wordpress/
    
        restart: always
    
        env_file:
            - .env
        container_name: wordpress
        
        depends_on:
            - mariadb

        volumes:
            - storage_wordpress:/srv/www/wordpress
        networks:
            - inception
    nginx:
        container_name: nginx
        build: srcs/requirements/nginx/
        
        restart: always
        
        ports:
            - 443:443
        networks:
            - inception
        
        depends_on:
            - wordpress
    
        
networks:
    inception:
        driver: bridge
        
volumes:
    storage:
        driver_opts:
            type: "none"
            o: "bind"
            device: "/home/zel-yama/data/mariadb"
    storage_wordpress:
        driver_opts:
            type: "none"
            o: "bind"
            device: "/home/zel-yama/data/wordpress"